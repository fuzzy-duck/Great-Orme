name: Deploy site to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write build info
        run: |
          echo "${{ github.sha }} | $(date -u '+%d %b %Y %H:%M UTC')" > build-info.txt

      - name: Deploy via SFTP
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 60;
            set net:max-retries 3;
            open sftp://${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_PASSWORD }}@${{ secrets.DEPLOY_HOST }};
            mirror --reverse --parallel=4 --exclude='^\.git/' --exclude='^\.github/' ./ ${{ secrets.DEPLOY_PATH }}/;
            quit
          "
